server:
  port: 8081
spring:
  application:
    name: "ms-user"
  devtools:
    add-properties: false
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5432/user-db"
    username: "admin"
    password: "admin"
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "none"
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  tracing:
    sampling:
      probability: 1.0  # Captura el 100% de las trazas para desarrollo
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/logs
  otlp:
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
# Security Config
security:
  jwtKeyPrivate: "9c9c48d57077710e8a8ec4a72f0c959fa11ea2c2e1073b7c7d39b4eefff5ddf8"
  jwtUserGenerator: "AUTH0JWT-BACKEND"
  jwtExpiration: 14400000
