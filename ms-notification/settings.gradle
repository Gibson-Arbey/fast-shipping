pluginManagement {
    repositories {
        //mavenLocal()
        gradlePluginPortal()
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'ms-notification'

include ':app-service'
include ':model'
include ':usecase'
project(':app-service').projectDir = file('./applications/app-service')
project(':model').projectDir = file('./domain/model')
project(':usecase').projectDir = file('./domain/usecase')
include ':mq-listener'
project(':mq-listener').projectDir = file('./infrastructure/entry-points/mq-listener')
include ':email-notification'
project(':email-notification').projectDir = file('./infrastructure/driven-adapters/email-notification')
include ':twilio-notification'
project(':twilio-notification').projectDir = file('./infrastructure/driven-adapters/twilio-notification')
