server:
  port: 8082
spring:
  application:
    name: "ms-shipping"
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:fastshipping}
    password: ${RABBITMQ_PASSWORD:fastshipping_dev}
  devtools:
    add-properties: false
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5433/shipping-db"
    username: "admin"
    password: "admin"
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "none"
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
  flyway:
    enabled: true
# Eureka Config
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
# Security Config
security:
  jwtKeyPrivate: "9c9c48d57077710e8a8ec4a72f0c959fa11ea2c2e1073b7c7d39b4eefff5ddf8"
  jwtUserGenerator: "AUTH0JWT-BACKEND"
services:
  user:
    base-url: "${USER_SERVICE_BASE_URL:http://localhost:8081}"
    internal-api-key: "${INTERNAL_SERVICE_API_KEY:fastshipping_internal_dev}"
logging:
  level:
    org.springframework.security: TRACE
