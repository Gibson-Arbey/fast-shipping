server:
  port: 8080
spring:
  application:
    name: "ms-shipping"
  devtools:
    add-properties: false
  threads:
    virtual:
      enabled: true
  datasource:
    url: "jdbc:postgresql://localhost:5433/shipping-db"
    username: "admin"
    password: "admin"
    driver-class-name: "org.postgresql.Driver"
  jpa:
    hibernate:
      ddl-auto: "none"
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: "org.hibernate.dialect.PostgreSQLDialect"
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      default-zone: "http://localhost:8761/eureka/"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
