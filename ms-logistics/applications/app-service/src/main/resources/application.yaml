##Spring Configuration
server:
  port: 8080
spring:
  application:
    name: ms-logistics
  threads:
    virtual:
      enabled: true
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: /h2
  profiles:
    include:
# Eureka Config
eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      default-zone: http://localhost:8761/eureka/